[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solo-empire-integrations-api"
version = "0.1.0"
description = "Read-only projection of the Solo Empire external app registry"
requires-python = ">=3.11"
dependencies = ["solo-empire-service-auth>=0.1.0,<0.2", "sentry-sdk>=2.72,<3"]

[tool.setuptools]
py-modules = ["server", "_sentry", "integrations_mcp"]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3", "httpx>=0.27,<1"]  # integrations-mcp (integrations_mcp.py); not needed by the API image
dev = ["pytest>=8", "mcp>=2.3,<3", "httpx>=0.27,<1"]

[project.scripts]
integrations-mcp = "integrations_mcp:main"
