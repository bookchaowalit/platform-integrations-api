# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      python-version: "3.12" # matches the python:3.12-slim runtime image
      # Install is auto: uv.lock -> uv sync --frozen --all-extras (the vendored
      # solo-empire-service-auth is a path source in pyproject.toml, as in the Dockerfile).
      # Ratchet: measured 89.96% on 2026-10-22 (threshold = measured - 2); raise it as tests grow.
      coverage-threshold: "87"

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
